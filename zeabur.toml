[project]
name = "line-assistant"
description = "Line Assistant with Frontend and Backend"

[services]
# 主要服務：同時運行前後端
[services.app]
name = "line-assistant-app"
plan = "free"
source = "."
builder = "nixpacks"
buildCommand = "cd backend && pip install -r requirements.txt && cd ../frontend && npm install && npm run build"
startCommand = "cd backend && python run.py"
ports = [8000]
healthcheckPath = "/health"
healthcheckTimeout = 300

# PostgreSQL 服務
[services.db]
name = "line-assistant-db"
plan = "free"
type = "postgresql"

# 環境變數配置（只包含非敏感資訊）
[services.app.envs]
# 資料庫連接（連接到 Zeabur PostgreSQL）
DATABASE_URL = "${POSTGRES_CONNECTION_STRING}"
# 強制使用 buildpacks 構建器
ZBUILDER = "buildpacks"
BUILDER = "buildpacks"

# 強制構建器設定
[services.app.build]
builder = "buildpacks"
